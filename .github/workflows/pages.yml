name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 문서(docs/)만 바뀐 푸시는 배포를 시작하지 않는다 (진행 중 배포가 취소되는 문제, C.45 11번). 사이트는 docs/ 파일을 쓰지 않는다
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # C.78l: 밸런스 점검은 build 와 따로 병렬로 돈다 (커리어 시뮬은 워커 병렬, 가드 표는 실행 요약 화면).
  # C.78r(로드맵 마지막 단계): 2026-10-23 부터 보고만(continue-on-error) 하던 두 단계를 다시 배포 차단으로 — deploy 가 balance 를 기다린다.
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run balance:check
        env:
          COACH_MEASURE: '0'
      - run: npm run balance:engine:check

  deploy:
    needs: [build, balance]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
