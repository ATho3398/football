name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 문서(docs/)만 바뀐 푸시는 배포를 시작하지 않는다 (진행 중 배포가 취소되는 문제, C.45 11번). 사이트는 docs/ 파일을 쓰지 않는다
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # C.81k: main 은 그대로 pages 한 줄. 다른 브랜치 수동 실행(검사만)은 브랜치별 줄이라 main 배포를 기다리거나 막지 않는다
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-{0}', github.ref) }}
  # C.80x: 진행 중 CI 는 끝까지 돌리고 새 푸시는 최신 1개만 대기 (연속 푸시로 계속 취소되던 문제)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # C.78l: 밸런스 점검은 build 와 따로 병렬로 돈다 (커리어 시뮬은 워커 병렬, 가드 표는 실행 요약 화면).
  # C.78r(로드맵 마지막 단계): 2026-10-23 부터 보고만(continue-on-error) 하던 두 단계를 다시 배포 차단으로 — deploy 가 balance·engine 을 기다린다.
  # C.81k: balance:check(한 job 51분)를 커리어 작업 8조각으로 동시에 돌리고(SHARD=k/8, 작업 목록의 k, k+8, …번째),
  # balance job 이 조각 결과를 합쳐(MERGE_DIR) 기존과 같은 출력·같은 가드로 판정한다. 시드·표본·기준은 그대로
  balance-shard:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run balance:check
        env:
          COACH_MEASURE: '0'
          SHARD: ${{ matrix.shard }}/8
          SHARD_OUT: balance-shard-${{ matrix.shard }}.bin
      - uses: actions/upload-artifact@v7
        with:
          name: balance-shard-${{ matrix.shard }}
          path: balance-shard-${{ matrix.shard }}.bin
          retention-days: 1

  balance:
    needs: [balance-shard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: balance-shard-*
          path: balance-shards
          merge-multiple: true
      - run: npm run balance:check
        env:
          COACH_MEASURE: '0'
          MERGE_DIR: balance-shards

  # C.81k: 엔진 경량 가드(약 11분)는 balance 와 따로 병렬로
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run balance:engine:check

  deploy:
    needs: [build, balance, engine]
    # C.81k: main 이 아닌 브랜치에서 수동 실행(workflow_dispatch)하면 검사만 하고 배포는 건너뛴다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
