name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 문서(docs/)만 바뀐 푸시는 배포를 시작하지 않는다 (진행 중 배포가 취소되는 문제, C.45 11번). 사이트는 docs/ 파일을 쓰지 않는다
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 2026-10-23 사용자 승인: 움직임 먼저, 밸런스는 로드맵 마지막 단계에서 맞춘다.
      # 그때까지 밸런스 두 단계는 결과만 로그에 남기고 배포를 막지 않는다(마지막 단계에서 되돌림).
      - run: npm run balance:check
        continue-on-error: true
        env:
          COACH_MEASURE: '0'
      - run: npm run balance:engine:check
        continue-on-error: true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
