<!doctype html>
<html>
<head><meta charset="utf-8"><title>PLAYER ONE B — cover</title>
<style>
  html, body { margin: 0; background: var(--surface-0); }
  .cover { position: relative; width: 960px; height: 320px; overflow: hidden; background: var(--surface-0); }
  .slab { position: absolute; right: -60px; top: -40px; width: 330px; height: 400px; background: var(--brand); transform: skewX(-14deg); }
  .bar { position: absolute; right: 300px; top: -40px; width: 18px; height: 400px; background: var(--brand); transform: skewX(-14deg); }
  .kit { position: absolute; right: 30px; top: -46px; font-family: var(--font-display); font-weight: 800; font-size: 360px; line-height: 400px; color: var(--on-brand); }
  .tick { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: var(--brand); display: flex; align-items: center; gap: 0; font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--on-brand); white-space: nowrap; }
  .tick span { padding: 0 18px; border-right: 2px solid var(--on-brand); }
  .tick b { height: 100%; display: flex; align-items: center; padding: 0 16px; background: var(--on-brand); color: var(--brand); }
  .text { position: absolute; left: 40px; top: 52px; }
  .kick { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .14em; color: var(--brand); }
  .name { margin: 4px 0 0; font-family: var(--font-display); font-weight: 800; font-size: 104px; line-height: .9; color: var(--ink); }
  .tag { margin: 14px 0 0; font-family: var(--font-sans); font-size: 14px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="slab"></div><div class="bar"></div><div class="kit">1</div>
  <div class="text"><div class="kick">B · BROADCAST</div><p class="name">PLAYER ONE</p><p class="tag">열일곱 살부터 은퇴까지 — 중계 그래픽처럼 보는 내 커리어</p></div>
  <div class="tick"><b>NEXT</b><span>꺾인 사각형</span><span>이탤릭 숫자</span><span>미페 머리말</span><span>홈 가운데</span></div>
</div>
</body>
</html>
