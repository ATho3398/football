<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body>
<div id="root" style="padding:16px"></div>
<script>
  var P = window.PlayerOne, h = React.createElement;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(8, 1fr)',gap:10,color:'var(--ink)'}}, P.Icon.names.map(function(n){return h('div',{key:n,style:{display:'grid',justifyItems:'center',gap:4,fontSize:9,color:'var(--ink-muted)'}}, h(P.Icon,{name:n,size:22,style:{color:'var(--ink)'}}), n);})));
</script>
</body>
</html>
