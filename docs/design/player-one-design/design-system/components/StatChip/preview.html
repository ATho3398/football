  render(h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}}, h(P.StatChip,{icon:'ball',label:'골',value:1,tone:'mine'}), h(P.StatChip,{label:'슈팅',value:3}), h(P.StatChip,{label:'XP',value:'+34',tone:'brand'}), h(P.StatChip,{icon:'card',label:'경고',value:1,tone:'warning'}), h(P.StatChip,{icon:'check',label:'돌파',value:'2/3',tone:'success'}), h(P.StatChip,{icon:'close',label:'패스 실패',value:2,tone:'fail'})));
