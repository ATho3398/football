<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>페이스온-위치맞추기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playerone/tokens.css">
<link rel="stylesheet" href="ds/playerone/components/bundle.css">
<script src="ds/playerone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
<x-import component-from-global-scope="PlayerOne.HeroPanel" title="위치 맞추기" compact="{{yes}}" eyebrow="손흥민 · 24~29세 칸" chips="{{posChips}}"></x-import><div style="display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 16px;">
<div style="position: relative; align-self: center; width: 300px; height: 300px; border-radius: 16px; overflow: hidden; background-color: var(--surface-2); background-image: linear-gradient(45deg, var(--surface-3) 25%, transparent 25%, transparent 75%, var(--surface-3) 75%), linear-gradient(45deg, var(--surface-3) 25%, transparent 25%, transparent 75%, var(--surface-3) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px;"><div style="position: absolute; left: 30px; top: 18px; width: 260px; height: 260px;"><x-import component-from-global-scope="PlayerOne.Avatar" name="손흥민" size="{{i260}}" shape="square"></x-import></div><div style="position: absolute; inset: 0; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--brand-ink);"></div><div style="position: absolute; left: 50px; top: 50px; width: 200px; height: 200px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,.55);"></div><span style="position: absolute; left: 10px; bottom: 10px; height: 22px; padding: 0 8px; border-radius: 6px; background: #121317; color: #f3f4f6; font-size: 11px; line-height: 22px; font-weight: 700;">원 = 얼굴 마커로 잘리는 곳</span></div><span style="font-size: 12px; line-height: 17px; color: var(--ink-muted); word-break: keep-all; text-align: center;">체크무늬 = 투명한 곳. 정사각형 그대로 카드·목록에 쓰고, 원은 경기 화면 얼굴 마커예요.</span><x-import component-from-global-scope="PlayerOne.Slider" label="확대" value="{{zoom}}" value-label="1.3배" left="1배" right="3배"></x-import><x-import component-from-global-scope="PlayerOne.Slider" label="위아래" value="{{vy}}" value-label="위로 4%" left="아래" right="위"></x-import><x-import component-from-global-scope="PlayerOne.Slider" label="좌우" value="{{vx}}" value-label="오른쪽 6%" left="왼쪽" right="오른쪽"></x-import><div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 4px;"><x-import component-from-global-scope="PlayerOne.Button" variant="secondary" size="lg" block="{{yes}}">취소</x-import><x-import component-from-global-scope="PlayerOne.Button" size="lg" block="{{yes}}" icon="check">저장</x-import></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dockBadges = {}, dockLocked = [];
    return { dockBadges, dockLocked, yes: true, no: false, i16: 16, i18: 18, i20: 20, i40: 40, i44: 44, i56: 56, heroChips: ['손흥민', { label: '이 브라우저에 저장', soft: true }],
      jumpTabs: [{ id: 'play', label: '경기 진행' }, { id: 'view', label: '화면 보기' }, { id: 'names', label: '선수 이름' }, { id: 'save', label: '저장·안내' }, { id: 'face', label: '페이스온' }, { id: 'pack', label: '페이스팩' }, { id: 'ver', label: '버전' }],
      decideTabs: [{ id: 'manual', label: '직접' }, { id: 'auto', label: '자동' }],
      freqTabs: [{ id: 'all', label: '모든 순간' }, { id: 'key', label: '중요한 순간만' }, { id: 'crit', label: '결정적 순간만' }],
      simTabs: [{ id: 'full', label: '전체 엔진' }, { id: 'fast', label: '빠른 진행' }],
      posChips: [], i260: 260, zoom: 15, vy: 54, vx: 56 };
  }
}
</script>
</body>
</html>
