<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>새 게임 - 가상 유망주</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playerone/tokens.css">
<link rel="stylesheet" href="ds/playerone/components/bundle.css">
<script src="ds/playerone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1120px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.HeroPanel" title="새 게임" eyebrow="커리어를 시작할 선수" value="17세" pad="{{no}}" chips="{{chips}}"></x-import>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0;">
    <span style="font-size: 11px; font-weight: 700; color: var(--ink-muted);">시작 방식</span>
    <x-import component-from-global-scope="PlayerOne.Tabs" variant="segment" fill="{{yes}}" items="{{modes}}" value="{{mode}}" label="시작 방식"></x-import>
    <div style="height: 4px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="포지션" action="12개 중 1개"></x-import>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{positions}}" as="p" hint-placeholder-count="12">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 54px; border-radius: 12px; background: {{p.bg}}; color: {{p.fg}}; box-shadow: {{p.ring}};">
          <b style="font-family: var(--font-display); font-weight: 700; font-size: 15px;">{{p.code}}</b><span style="font-size: 10px; font-weight: 700; opacity: .75;">{{p.name}}</span>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 12px; line-height: 17px; color: var(--ink-muted);"><b style="color: var(--ink);">ST 스트라이커</b> · 핵심 능력치 마무리 · 위치 선정 · 침착함. 전술 화면에서 정한 슬롯 역할로 뛰어요.</span>
    <div style="height: 4px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="이름"></x-import>
    <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; background: var(--surface-1); box-shadow: inset 0 0 0 1.5px var(--brand-ink);">
      <span style="flex-grow: 1; font-size: 16px; font-weight: 700;">김민준<span style="display: inline-block; width: 2px; height: 18px; margin-left: 2px; vertical-align: -3px; background: var(--brand);"></span></span>
      <span style="font-size: 11px; font-weight: 700; color: var(--ink-faint);">3/12</span>
    </div>
    <div style="height: 4px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="난이도"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{diff}}" as="d" hint-placeholder-count="3">
        <x-import component-from-global-scope="PlayerOne.OptionRow" title="{{d.t}}" desc="{{d.desc}}" tag="{{d.tag}}" radio="{{yes}}" selected="{{d.on}}"></x-import>
      </sc-for>
    </div>
  </div>
  <div style="margin-top: auto; padding: 20px 16px 24px;">
    <x-import component-from-global-scope="PlayerOne.Button" size="lg" block="{{yes}}" icon-right="chevron-right">리버사이드 FC 유스로 시작</x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const POS = [['GK','골키퍼'],['CB','센터백'],['LB','왼쪽 풀백'],['RB','오른쪽 풀백'],['CDM','수비형 미드'],['CM','중앙 미드'],['CAM','공격형 미드'],['LM','왼쪽 미드'],['RM','오른쪽 미드'],['LW','왼쪽 윙'],['RW','오른쪽 윙'],['ST','스트라이커']];
    return {
      yes: true, no: false, mode: 'prospect',
      modes: [{ id: 'prospect', label: '가상 유망주' }, { id: 'real', label: '실제 선수' }],
      chips: ['OVR 52~56에서 시작', { label: '능력치는 포지션별 기본값', soft: true }],
      positions: POS.map((p) => { const on = p[0] === 'ST'; return { code: p[0], name: p[1], bg: on ? 'var(--brand)' : 'var(--surface-1)', fg: on ? 'var(--on-brand)' : 'var(--ink)', ring: 'none' }; }),
      diff: [
        { t: '쉬움', desc: '결정 순간 성공 확률 +5%p · 감독 신뢰도가 빨리 올라요', tag: '', on: false },
        { t: '보통', desc: '기획서 기준 수치 그대로', tag: '추천', on: true },
        { t: '어려움', desc: '성공 확률 −5%p · 주전 경쟁이 더 치열해요', tag: '', on: false }
      ]
    };
  }
}
</script>
</body>
</html>
