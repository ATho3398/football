<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경기 화면 - 장면 전환</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playerone/tokens.css">
<link rel="stylesheet" href="ds/playerone/components/bundle.css">
<script src="ds/playerone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.ScoreBar" mode="manual" home-tactic="{{homeTactic}}" away-tactic="{{awayTactic}}" home="리버사이드 FC" away="리버풀" home-score="{{zero}}" away-score="{{zero}}" minute="{{minute}}" minute-to="{{minuteTo}}" speed="1×" view="transition" scene="{{scene}}"></x-import>
  <div style="position: relative; padding: 8px 16px 4px;">
    <x-import component-from-global-scope="PlayerOne.Pitch" players="{{players}}" arrows="{{arrows}}" label="장면 전환: 선수들이 다음 장면 위치로 이동 중"></x-import>
    <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; background: #121317; color: #f3f4f6; font-family: var(--font-display); font-size: 18px; font-weight: 700;"><span style="opacity: .5;">23'</span><span style="color: #d6ff3c;">→</span><span>31'</span></span>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 16px 8px; font-size: 12px; font-weight: 700; color: var(--ink-muted);">
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint);"></span>다음 장면으로 넘어가는 중 · 약 1초</span>
    <span>배속은 장면 안에서만</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin: 0 16px 10px; padding: 12px 14px; border-radius: 16px; background: var(--surface-1); box-shadow: inset 0 0 0 1px var(--line-strong);">
    <span style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--surface-3); color: var(--brand-ink);">
      <x-import component-from-global-scope="PlayerOne.Icon" name="ff" size="{{icon}}"></x-import>
    </span>
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <span style="font-size: 11px; font-weight: 700; color: var(--ink-muted);">23' ~ 31' 요약</span>
      <span style="font-size: 15px; font-weight: 800;">8분간 우리 점유 62% · 슈팅 1</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 16px 8px;">
    <sc-for list="{{feed}}" as="item" hint-placeholder-count="2">
      <x-import component-from-global-scope="PlayerOne.FeedItem" minute="{{item.minute}}" kind="{{item.kind}}" mine="{{item.mine}}" text="{{item.text}}" score="{{item.score}}"></x-import>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; margin: 0 16px; padding: 10px 12px; border-radius: 16px; background: var(--surface-1);">
    <x-import component-from-global-scope="PlayerOne.Avatar" size="{{avatar}}" ring="{{yes}}"></x-import>
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800;">김민준 <span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--mine-soft); color: var(--mine); font-size: 11px; font-weight: 800;">ST 슬롯 · 포처</span></span>
      <x-import component-from-global-scope="PlayerOne.FatigueGauge" value="{{fatigue}}" compact="{{yes}}"></x-import>
    </div>
    <x-import component-from-global-scope="PlayerOne.RatingBadge" value="{{rating}}" delta="{{ratingDelta}}"></x-import>
  </div>
  <div style="margin-top: auto; padding-top: 12px; border-radius: 20px 20px 0 0; background: var(--surface-1); opacity: 0.55;">
    <div style="display: flex; justify-content: space-between; padding: 0 16px; font-size: 12px; font-weight: 700;">
      <span>내 패 <span style="font-family: var(--font-display);">5</span></span>
      <span style="color: var(--ink-muted);">장면 사이에는 쓸 수 없어요</span>
    </div>
    <x-import component-from-global-scope="PlayerOne.CardHand" cards="{{hand}}"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (list, team, dim) => list.map((p) => ({ x: p[0], y: p[1], num: p[2], team, dim, me: !!p[3], label: p[3] ? '김민준' : undefined }));
    const tac = { homeTactic: { tactic: 'counter', formation: '4-2-3-1' }, awayTactic: { tactic: 'gegen', formation: '4-3-3' } };
    const hand = [
      { id: 'calm', name: '침착한 마무리', type: 'passive', rarity: 'common' },
      { id: 'fk', name: '프리킥 스페셜', type: 'setpiece', rarity: 'rare' },
      { id: 'mom', name: '기세', type: 'combo', rarity: 'rare' },
      { id: 'pan', name: '파넨카', type: 'setpiece', rarity: 'epic' },
      { id: 'focus', name: '집중', type: 'manage', rarity: 'common' }
    ];
    const FROM = [[16,50,1],[34,18,2],[30,40,4],[31,62,5],[36,84,3],[40,34,8],[46,56,6],[55,72,10],[60,22,7],[58,44,9,1],[52,82,11]];
    const HOME = [[10,50,1],[30,14,2],[26,38,4],[26,60,5],[30,86,3],[38,28,8],[36,52,6],[44,70,10],[48,18,7],[50,46,9,1],[46,80,11]];
    const AWAY = [[95,50,1],[78,24,2],[76,42,5],[77,60,4],[78,78,3],[64,30,7],[60,48,8],[62,66,6],[56,80,11],[54,40,9],[56,58,10]];
    const ghost = HOME.filter((p, i) => [5, 8, 9, 7].includes(i)).map((p) => { const f = FROM.find((q) => q[2] === p[2]); return { from: [f[0], f[1]], to: [p[0], p[1]], kind: 'pass', ghost: true }; });
    return Object.assign({
      scene: { index: 3, total: 7, minute: 23 },
      yes: true, zero: 0, minute: 23, minuteTo: 31, icon: 20, avatar: 36, fatigue: 22, rating: 6.9, ratingDelta: 0,
      players: mk(HOME, 'home', true).concat(mk(AWAY, 'away', true)),
      arrows: ghost,
      feed: [
        { minute: 23, kind: 'shot', text: '장면 3 · 역습 → 김민준 슈팅, 골대 위로' }
      ],
      hand
    }, tac);
  }
}
</script>
</body>
</html>
