<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카드 확정 - 사선 분할</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playerone/tokens.css">
<link rel="stylesheet" href="ds/playerone/components/bundle.css">
<script src="ds/playerone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="width: 390px; height: 1180px; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans); padding: 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <span style="align-self: flex-start; height: 22px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 6px; background: var(--brand); color: var(--on-brand); font-size: 11px; font-weight: 800;">확정</span>
    <span style="font-size: 20px; line-height: 28px; font-weight: 800; letter-spacing: -0.02em;">사선 분할</span>
    <span style="font-size: 13px; line-height: 19px; color: var(--ink-muted);">그림은 날카로운 사선에서 잘리고, 아래 희귀도 색 줄무늬 두 줄. 스크린톤·글자 그림자 없음.</span>
  </div>
  <div style="display: flex; justify-content: center;">
    <x-import component-from-global-scope="PlayerOne.GameCard" card="{{fk}}" size="full"></x-import>
  </div>
  <span style="font-size: 12px; font-weight: 700; color: var(--ink-muted);">카드 풀 (0.6배) · 조건 미달 예시 포함</span>
  <div style="display: flex; justify-content: space-between;">
    <x-import component-from-global-scope="PlayerOne.GameCard" card="{{pan}}" size="deck"></x-import>
    <x-import component-from-global-scope="PlayerOne.GameCard" card="{{calm}}" size="deck"></x-import>
  </div>
  <span style="font-size: 12px; font-weight: 700; color: var(--ink-muted);">덱 슬롯 · 경기 중 패 (간략형)</span>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px;">
    <x-import component-from-global-scope="PlayerOne.GameCard" card="{{calm2}}" size="mini"></x-import>
    <x-import component-from-global-scope="PlayerOne.GameCard" card="{{fk}}" size="mini"></x-import>
    <x-import component-from-global-scope="PlayerOne.GameCard" card="{{pan}}" size="mini"></x-import>
  </div>
  <div style="display: flex; gap: 8px;">
    <x-import component-from-global-scope="PlayerOne.GameCard" card="{{fk}}" size="hand" state="selected"></x-import>
    <x-import component-from-global-scope="PlayerOne.GameCard" card="{{mom}}" size="hand"></x-import>
    <x-import component-from-global-scope="PlayerOne.GameCard" card="{{calm}}" size="hand"></x-import>
    <x-import component-from-global-scope="PlayerOne.GameCard" card="{{pan}}" size="hand" state="locked" reason="조건 미달"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const calm = { name: '침착한 마무리', type: 'passive', rarity: 'common', level: 3, effect: { pre: '박스 안에서 슈팅할 때 성공 확률이 ', hi: '+6%p', post: ' 올라가요.' }, condition: { text: '침착성 50 이상', met: true, current: 55 } };
    return {
      fk: { name: '프리킥 스페셜', type: 'setpiece', rarity: 'rare', level: 2, effect: { pre: '프리킥에서 직접 슈팅을 고르면 성공 확률이 ', hi: '+12%p', post: ' 올라가요.' }, condition: { text: '프리킥 능력치 60 이상', met: true, current: 64 } },
      pan: { name: '파넨카', type: 'setpiece', rarity: 'epic', level: 1, effect: { pre: '페널티킥을 넣으면 평점이 ', hi: '+0.5', post: ' 더 올라가요.' }, condition: { text: '침착성 70 이상', met: false, current: 55 } },
      mom: { name: '기세', type: 'combo', rarity: 'rare', level: 2 },
      calm, calm2: Object.assign({}, calm, { count: 2 })
    };
  }
}
</script>
</body>
</html>
