<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>순위표 · 리그 스타</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playerone/tokens.css">
<link rel="stylesheet" href="ds/playerone/components/bundle.css">
<script src="ds/playerone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1430px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.HeroPanel" title="리그" right="22R / 38" eyebrow="리버사이드 FC 순위" value="4위" pad="{{no}}" chips="{{chips}}"></x-import>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0;">
    <x-import component-from-global-scope="PlayerOne.Tabs" variant="underline" items="{{tabs}}" value="table"></x-import>
    <div style="display: flex; flex-direction: column; padding: 6px 4px; border-radius: 16px; background: var(--surface-1);">
      <div style="display: grid; grid-template-columns: 26px 1fr 30px 38px 34px; align-items: center; gap: 6px; height: 28px; padding: 0 10px; font-size: 10px; font-weight: 800; color: var(--ink-faint);">
        <span>#</span><span>팀</span><span style="text-align: right;">경기</span><span style="text-align: right;">득실</span><span style="text-align: right;">승점</span>
      </div>
      <sc-for list="{{rows}}" as="t" hint-placeholder-count="10">
        <div style="display: grid; grid-template-columns: 26px 1fr 30px 38px 34px; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border-radius: 10px; background: {{t.bg}}; box-shadow: {{t.line}}; font-size: 13px;">
          <b style="font-family: var(--font-display); font-weight: 700; font-size: 13px; color: {{t.rankInk}};">{{t.r}}</b>
          <span style="display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: {{t.fw}};"><x-import component-from-global-scope="PlayerOne.Crest" name="{{t.team}}" size="{{i18}}"></x-import><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{t.team}}</span></span>
          <span style="font-family: var(--font-display); font-weight: 700; font-size: 12px; text-align: right; color: var(--ink-muted);">{{t.p}}</span>
          <span style="font-family: var(--font-display); font-weight: 700; font-size: 12px; text-align: right; color: var(--ink-muted);">{{t.gd}}</span>
          <b style="font-family: var(--font-display); font-weight: 700; font-size: 14px; text-align: right;">{{t.pts}}</b>
        </div>
      </sc-for>
      <div style="display: flex; gap: 12px; padding: 8px 10px 4px; font-size: 10px; font-weight: 700; color: var(--ink-muted);">
        <span style="display: inline-flex; align-items: center; gap: 4px;"><i style="width: 3px; height: 10px; border-radius: 2px; background: var(--brand);"></i>유럽 대항전</span>
        <span style="display: inline-flex; align-items: center; gap: 4px;"><i style="width: 3px; height: 10px; border-radius: 2px; background: var(--fail);"></i>강등</span>
        <span style="margin-left: auto;">20팀 중 10팀 표시 · 펼치기</span>
      </div>
    </div>
    <div style="height: 6px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="리그 스타" action="22R 기준"></x-import>
    <x-import component-from-global-scope="PlayerOne.Tabs" variant="segment" items="{{starTabs}}" value="goals" label="리그 스타 기준"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--surface-1); box-shadow: {{s.ring}};">
          <b style="font-family: var(--font-display); font-weight: 700; width: 18px; font-size: 14px; color: {{s.rankInk}};">{{s.r}}</b>
          <x-import component-from-global-scope="PlayerOne.Avatar" name="{{s.name}}" size="{{i36}}" ring="{{s.me}}"></x-import>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
            <span style="font-size: 14px; font-weight: 800; color: {{s.nameInk}};">{{s.name}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--ink-muted);"><x-import component-from-global-scope="PlayerOne.Crest" name="{{s.team}}" size="{{i14}}"></x-import>{{s.team}} · {{s.pos}}</span>
          </div>
          <span style="display: flex; flex-direction: column; align-items: flex-end;"><b style="font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 22px;">{{s.v}}</b><span style="font-size: 10px; font-weight: 700; color: var(--ink-faint);">골</span></span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="margin-top: auto;">
    <x-import component-from-global-scope="PlayerOne.Tabs" variant="nav" items="{{nav}}" value="world"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1430}}'>
class Component extends DCLogic {
  renderVals() {
    const T = [['포트 유나이티드',22,'+24',50],['레드힐 시티',22,'+19',46],['노스게이트',22,'+12',41],['리버사이드 FC',22,'+9',39],['하버 애슬레틱',22,'+7',37],['리버풀',22,'+4',35],['웨스트브룩',22,'+1',31],['스톤필드',22,'−2',30],['밀레인 로버스',22,'−5',28],['애스턴 베일',22,'−6',27]];
    const rows = T.map((t, i) => { const me = t[0] === '리버사이드 FC'; return { r: i + 1, team: t[0], p: t[1], gd: t[2], pts: t[3], fw: me ? 800 : 600,
      bg: me ? 'var(--mine-soft)' : 'transparent', line: i < 4 ? 'inset 3px 0 0 var(--brand)' : 'none', rankInk: me ? 'var(--mine)' : 'var(--ink)' }; });
    const st = (r, name, team, pos, v, me) => ({ r, name, team, pos, v, me: !!me, ring: me ? 'inset 0 0 0 1.5px var(--mine)' : 'none', nameInk: me ? 'var(--mine)' : 'var(--ink)', rankInk: r === 1 ? 'var(--brand-ink)' : 'var(--ink)' });
    return {
      rows, yes: true, no: false, i14: 14, i18: 18, i36: 36,
      chips: ['승점 39', '1위와 11점', { label: '유럽 대항전권', soft: true }],
      tabs: [{ id: 'table', label: '순위표' }, { id: 'fixtures', label: '일정 · 결과' }],
      starTabs: [{ id: 'goals', label: '득점' }, { id: 'assists', label: '도움' }, { id: 'rating', label: '평점' }, { id: 'young', label: '영플레이어' }],
      stars: [st(1, '마르코 실바', '레드힐 시티', 'RW', 17), st(2, '이태경', '포트 유나이티드', 'ST', 14), st(3, '오스카 렌', '노스게이트', 'ST', 12), st(4, '김민준', '리버사이드 FC', 'ST', 9, true), st(5, '정다온', '하버 애슬레틱', 'CAM', 9)],
      nav: [{ id: 'home', label: '홈', icon: 'home' }, { id: 'match', label: '경기', icon: 'match' }, { id: 'player', label: '선수', icon: 'player' }, { id: 'career', label: '커리어', icon: 'career' }, { id: 'world', label: '세계', icon: 'world' }]
    };
  }
}
</script>
</body>
</html>
