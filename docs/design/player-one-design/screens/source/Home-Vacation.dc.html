<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈 - 휴가</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playerone/tokens.css">
<link rel="stylesheet" href="ds/playerone/components/bundle.css">
<script src="ds/playerone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.HeroPanel" title="홈" on-back="{{no}}" right="휴가 중" eyebrow="9월 · 수요일 · A매치 휴식기" value="2" pad="{{no}}" progress="{{no}}" chips="{{chips}}"></x-import>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0;">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border-radius: 10px; background: {{d.bg}}; color: {{d.ink}}; box-shadow: {{d.ring}};">
          <span style="font-size: 10px; font-weight: 700; opacity: .8;">{{d.w}}</span>
          <b style="font-family: var(--font-display); font-size: 15px; line-height: 18px;">{{d.n}}</b>
          <span style="display: inline-flex; height: 14px; color: {{d.ic}};"><x-import component-from-global-scope="PlayerOne.Icon" name="{{d.icon}}" size="{{s14}}"></x-import></span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: var(--surface-1); box-shadow: inset 0 0 0 1.5px var(--mine);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--mine-soft); color: var(--mine);"><x-import component-from-global-scope="PlayerOne.Icon" name="plane" size="{{s22}}"></x-import></span>
        <span style="display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 16px;">A매치 휴식기</b><span style="font-size: 13px; color: var(--ink-muted);">9월 8일까지 휴가예요 (7일)</span></span>
      </div>
      <span style="font-size: 13px; line-height: 19px;">휴가 동안은 훈련이 없고 피로가 매일 회복돼요. 휴가 중에는 폼이 떨어지지 않아요.</span>
      <div style="display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--warning-soft); font-size: 12px; line-height: 17px;">
        <span style="flex: none; color: var(--warning); font-weight: 800;">!</span>
        <span>리그 외 경기가 있으면 그 일정에서 멈춰요. <b>9월 5일 리그컵 2R (원정)</b>에서 한 번 멈춰요.</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr; gap: 8px;">
      <x-import component-from-global-scope="PlayerOne.Button" size="lg" block="{{yes}}" icon="ff">휴가 끝까지 넘기기</x-import>
      <x-import component-from-global-scope="PlayerOne.Button" variant="ghost" size="lg" block="{{yes}}" icon="calendar">하루씩 진행</x-import>
    </div>
  </div>
  <div style="margin-top: auto;">
    <x-import component-from-global-scope="PlayerOne.Tabs" variant="nav" items="{{nav}}" value="home"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const day = (w, n, icon, kind, today) => ({ w, n, icon, bg: today ? 'var(--brand)' : kind === 'match' ? 'var(--surface-2)' : kind === 'off' ? 'transparent' : 'var(--surface-1)', ink: today ? 'var(--on-brand)' : 'var(--ink)', ic: today ? 'var(--on-brand)' : kind === 'match' ? 'var(--brand-ink)' : 'var(--ink-muted)', ring: kind === 'off' ? 'inset 0 0 0 1px var(--line)' : 'none' });
    return {
      yes: true, no: false, s14: 14, s22: 22,
      chips: ['휴가 1일째 · 8일까지', { label: '피로 회복 중', soft: true }],
      week: [day('월', 31, 'ball', 'match'), day('화', 1, 'plane', 'off'), day('수', 2, 'plane', 'off', true), day('목', 3, 'plane', 'off'), day('금', 4, 'plane', 'off'), day('토', 5, 'ball', 'match'), day('일', 6, 'plane', 'off')],
      nav: [{ id: 'home', label: '홈', icon: 'home' }, { id: 'match', label: '경기', icon: 'match' }, { id: 'player', label: '선수', icon: 'player' }, { id: 'career', label: '커리어', icon: 'career' }, { id: 'world', label: '세계', icon: 'world' }]
    };
  }
}
</script>
</body>
</html>
