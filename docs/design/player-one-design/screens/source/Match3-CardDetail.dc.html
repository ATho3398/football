<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경기 화면 - 카드 상세</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playerone/tokens.css">
<link rel="stylesheet" href="ds/playerone/components/bundle.css">
<script src="ds/playerone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.ScoreBar" mode="manual" home-tactic="{{homeTactic}}" away-tactic="{{awayTactic}}" home="리버사이드 FC" away="리버풀" home-score="{{one}}" away-score="{{zero}}" minute="{{minute}}" speed="2×" view="highlight" scene="{{scene}}"></x-import>
  <div style="padding: 12px 16px 0;">
    <x-import component-from-global-scope="PlayerOne.Pitch" players="{{players}}" ball="{{ball}}"></x-import>
  </div>
  <div style="position: absolute; inset: 0; background: var(--scrim);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0;">
    <x-import component-from-global-scope="PlayerOne.BottomSheet" inline="{{yes}}" eyebrow="카드 상세" title="결정 순간에 쓸 수 있어요" subtitle="경기는 계속 흘러요. 닫으면 바로 돌아가요.">
      <div style="display: flex; justify-content: center; padding: 4px 0 8px;">
        <x-import component-from-global-scope="PlayerOne.GameCard" card="{{card}}" size="full"></x-import>
      </div>
      <x-import component-from-global-scope="PlayerOne.Button" variant="secondary" size="lg" block="{{yes}}">닫기</x-import>
    </x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (list, team) => list.map((p) => ({ x: p[0], y: p[1], num: p[2], team, me: !!p[3], label: p[3] ? '김민준' : undefined }));
    const HOME = [[6,50,1],[30,16,2],[28,40,4],[28,60,5],[31,84,3],[47,30,8],[44,52,6],[52,70,10],[66,20,7],[70,48,9,1],[63,80,11]];
    const AWAY = [[95,50,1],[81,22,2],[79,42,5],[80,60,4],[82,80,3],[68,28,7],[63,46,8],[64,62,6],[69,76,11],[54,38,9],[55,60,10]];
    return {
      scene: { index: 3, total: 7, minute: 41, label: '중원 압박' },
      homeTactic: { tactic: 'counter', formation: '4-2-3-1' }, awayTactic: { tactic: 'gegen', formation: '4-3-3' }, 
      yes: true, one: 1, zero: 0, minute: 41,
      players: mk(HOME, 'home').concat(mk(AWAY, 'away')),
      ball: [52.6, 68.4],
      card: { name: '프리킥 스페셜', type: 'setpiece', rarity: 'rare', level: 2, effect: { pre: '프리킥에서 직접 슈팅을 고르면 성공 확률이 ', hi: '+12%p', post: ' 올라가요.' }, condition: { text: '프리킥 능력치 60 이상', met: true, current: 64 } }
    };
  }
}
</script>
</body>
</html>
