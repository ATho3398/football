<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>경기화면-퇴장후10명</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 경기화면-퇴장후10명 (I.4 경기 화면) · 390×844 · 원본 Match2-RedCard.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.ScoreBar" mode="manual" home-tactic="{{homeTactic}}" away-tactic="{{awayTactic}}" home="리버사이드 FC" away="리버풀" home-score="{{two}}" away-score="{{zero}}" minute="{{minute}}" speed="2×" away-red="{{one}}"></x-import>
  <div style="padding: 8px 16px 4px;">
    <x-import component-from-global-scope="PlayerOne.Pitch" players="{{players}}" ball="{{ball}}" label="퇴장 후: 리버풀 10명, 수비 3명"></x-import>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 16px 8px; font-size: 12px; font-weight: 700; color: var(--ink-muted);">
    <span>코트 위 <b style="font-family: var(--font-display); color: var(--ink);">21</b>명 · 우리 11 / 상대 10</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 11px; border-radius: 1.5px; background: var(--card-red);"></span>상대 4번 퇴장</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin: 0 16px 10px; padding: 12px 14px; border-radius: 16px; background: var(--fail-soft);">
    <span style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--surface-1);">
      <span style="width: 16px; height: 22px; border-radius: 3px; background: var(--card-red);"></span>
    </span>
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <span style="font-size: 15px; font-weight: 800;">퇴장 — 리버풀 4번</span>
      <span style="font-size: 12px; color: var(--ink-muted);">상대가 10명이에요. 수비 뒷공간이 넓어졌어요.</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 16px 8px;">
    <sc-for list="{{feed}}" as="item" hint-placeholder-count="3">
      <x-import component-from-global-scope="PlayerOne.FeedItem" minute="{{item.minute}}" kind="{{item.kind}}" mine="{{item.mine}}" text="{{item.text}}" score="{{item.score}}"></x-import>
    </sc-for>
  </div>
  <div style="padding: 4px 16px 4px;">
    <x-import component-from-global-scope="PlayerOne.PossessionBar" home="{{poss}}"></x-import>
  </div>
  <div style="margin-top: auto; padding-top: 12px; border-radius: 20px 20px 0 0; background: var(--surface-1);">
    <div style="display: flex; justify-content: space-between; padding: 0 16px; font-size: 12px; font-weight: 700;">
      <span>내 패 <span style="font-family: var(--font-display);">4</span></span>
      <span style="color: var(--ink-muted);">결정 순간에 쓸 수 있어요</span>
    </div>
    <x-import component-from-global-scope="PlayerOne.CardHand" cards="{{hand}}"></x-import>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    const mk = (list, team) => list.map((p) => ({ x: p[0], y: p[1], num: p[2], team, me: !!p[3], label: p[3] ? '김민준' : undefined }));
    const HOME = [[8,50,1],[34,18,2],[32,40,4],[32,60,5],[35,82,3],[52,30,8],[48,52,6],[56,70,10],[72,20,7],[70,46,9,1],[70,78,11]];
    // 상대 4번 퇴장: 4번 마커를 빼고 수비를 3명으로 재정렬
    const AWAY = [[95,50,1],[80,28,2],[81,50,5],[80,72,3],[68,22,7],[65,42,8],[66,60,6],[70,80,11],[57,40,9],[59,60,10]];
    return {
      homeTactic: { tactic: 'counter', formation: '4-2-3-1' }, awayTactic: { tactic: 'gegen', formation: '4-3-3' }, 
      yes: true, two: 2, zero: 0, one: 1, minute: 72, poss: 63,
      players: mk(HOME, 'home').concat(mk(AWAY, 'away')),
      ball: [49.4, 53.4],
      feed: [
        { minute: 71, kind: 'foul', text: '파울: 상대 4번 — 김민준 저지' },
        { minute: 71, kind: 'red', text: '퇴장: 상대 4번 (두 번째 경고)' },
        { minute: 72, kind: 'normal', text: '리버풀이 수비를 3명으로 바꿉니다' }
      ],
      hand: [
        { id: 'fk', name: '프리킥 스페셜', type: 'setpiece', rarity: 'rare' },
        { id: 'mom', name: '기세', type: 'combo', rarity: 'rare' },
        { id: 'pan', name: '파넨카', type: 'setpiece', rarity: 'epic' },
        { id: 'focus', name: '집중', type: 'manage', rarity: 'common' }
      ]
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
