<template id="tpl">
<helmet>

body{margin:0;background:#16171b}

<div style="position: relative; width: 390px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans); padding-bottom: 72px; box-sizing: border-box;">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 16px 10px; background: var(--surface-1); border-radius: 0 0 20px 20px;"><div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;"><span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800;"><x-import component-from-global-scope="PlayerOne.Crest" name="토트넘 홋스퍼" size="{{i20}}"></x-import>토트넘</span><span style="display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 26px; line-height: 28px; font-weight: 700;">2<span style="font-size: 16px; color: var(--ink-faint);">:</span>0</span><span style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 13px; font-weight: 800; color: var(--away);">레스터<x-import component-from-global-scope="PlayerOne.Crest" name="레스터 시티" size="{{i20}}" color="var(--away)"></x-import></span></div><div style="display: flex; align-items: center; gap: 8px;"><span style="display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 7px; background: var(--brand); color: var(--on-brand); font-family: var(--font-display); font-size: 13px; font-weight: 700;">17'</span><span style="flex: 1; min-width: 0; font-size: 12px; font-weight: 700; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">결과 · 성공</span></div></div><div style="padding: 8px 16px 0;"><x-import component-from-global-scope="PlayerOne.Pitch" orient="vertical" players="{{players}}" ball="{{ball}}" arrows="{{arrows}}" crop="{{crop}}" marker="number" size="lg" names="all"></x-import></div><div style="display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 0;"><div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-1); box-shadow: inset 3px 0 0 var(--rarity-rare);"><span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0;"><span style="font-size: 11px; font-weight: 700; color: var(--ink-muted);">내 선택</span><b style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">플레이 카드 · 감아차기 · 먼 포스트 (21%)</b></span><span style="height: 22px; padding: 0 8px; border-radius: 6px; background: var(--brand-soft); color: var(--brand-ink); font-size: 11px; line-height: 22px; font-weight: 800; white-space: nowrap;">카드 사용</span></div><x-import component-from-global-scope="PlayerOne.ResultSplash" result="success" title="골! 먼 포스트 감아차기" detail="감아차기 21% · 성공 · 3-0" rating="{{rating}}" rating-delta="{{rdelta}}"></x-import><div style="display: flex; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface-1); font-size: 12px; line-height: 17px; color: var(--ink-muted);"><x-import component-from-global-scope="PlayerOne.Icon" name="card" size="{{i16}}"></x-import><span>감아차기는 이번 경기에서 다시 못 써요 · 장면 성공으로 카드 1장을 더 뽑았어요</span></div><x-import component-from-global-scope="PlayerOne.Button" size="lg" block="{{yes}}" icon-right="chevron-right">계속</x-import></div>

      P(85, 38, 4, 'away', 'B.바커르', { short: '바커르' }),
      P(77, 52, 10, 'away', 'Ga.올리베이라', { short: '올리베이라' }),

</script>
