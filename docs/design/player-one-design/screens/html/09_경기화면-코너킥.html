<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>경기화면-코너킥</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 경기화면-코너킥 (I.4 경기 화면) · 390×844 · 원본 Match2-Corner.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.ScoreBar" mode="manual" home-tactic="{{homeTactic}}" away-tactic="{{awayTactic}}" home="리버사이드 FC" away="리버풀" home-score="{{two}}" away-score="{{zero}}" minute="{{minute}}" speed="1×" status="코너킥"></x-import>
  <div style="padding: 8px 16px 4px;">
    <x-import component-from-global-scope="PlayerOne.Pitch" players="{{players}}" ball="{{ball}}" arrows="{{arrows}}" marks="{{marks}}" label="코너킥: 오른쪽 위 코너에서 박스로 크로스"></x-import>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin: 6px 16px 10px; padding: 12px 14px; border-radius: 16px; background: var(--surface-1);">
    <span style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--surface-3); color: var(--brand-ink);">
      <x-import component-from-global-scope="PlayerOne.Icon" name="corner" size="{{iconSize}}"></x-import>
    </span>
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <span style="font-size: 15px; font-weight: 800;">코너킥 · 오른쪽</span>
      <span style="font-size: 12px; color: var(--ink-muted);">키커 7번 이준호 · 김민준은 니어 포스트로 침투</span>
    </div>
    <span style="height: 24px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 7px; background: var(--surface-3); font-size: 11px; font-weight: 700;">헤더 <b style="margin-left: 4px; font-family: var(--font-display);">50</b></span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 16px 8px;">
    <sc-for list="{{feed}}" as="item" hint-placeholder-count="3">
      <x-import component-from-global-scope="PlayerOne.FeedItem" minute="{{item.minute}}" kind="{{item.kind}}" mine="{{item.mine}}" text="{{item.text}}" score="{{item.score}}"></x-import>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; margin: 0 16px; padding: 10px 12px; border-radius: 16px; background: var(--surface-1);">
    <x-import component-from-global-scope="PlayerOne.Avatar" size="{{avatar}}" ring="{{yes}}"></x-import>
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800;">김민준 <span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--mine-soft); color: var(--mine); font-size: 11px; font-weight: 800;">ST 슬롯 · 포처</span></span>
      <x-import component-from-global-scope="PlayerOne.FatigueGauge" value="{{fatigue}}" compact="{{yes}}"></x-import>
    </div>
    <x-import component-from-global-scope="PlayerOne.RatingBadge" value="{{rating}}"></x-import>
  </div>
  <div style="margin-top: auto; padding-top: 12px; border-radius: 20px 20px 0 0; background: var(--surface-1);">
    <div style="display: flex; justify-content: space-between; padding: 0 16px; font-size: 12px; font-weight: 700;">
      <span>내 패 <span style="font-family: var(--font-display);">4</span></span>
      <span style="color: var(--ink-muted);">헤더 경합이 오면 멈춰요</span>
    </div>
    <x-import component-from-global-scope="PlayerOne.CardHand" cards="{{hand}}"></x-import>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    const mk = (list, team) => list.map((p) => ({ x: p[0], y: p[1], num: p[2], team, me: !!p[3], label: p[3] ? '김민준' : undefined }));
    const HOME = [[14,50,1],[50,30,2],[48,50,4],[52,70,5],[60,86,3],[76,28,8],[80,62,6],[90,58,10],[98.6,3,7],[90,40,9,1],[86,48,11]];
    const AWAY = [[97,48,1],[93,36,2],[92,44,5],[91,54,4],[89,62,3],[88,32,7],[86,42,8],[84,56,6],[80,72,11],[72,44,9],[96,30,10]];
    return {
      homeTactic: { tactic: 'counter', formation: '4-2-3-1' }, awayTactic: { tactic: 'gegen', formation: '4-3-3' }, 
      yes: true, two: 2, zero: 0, minute: 64, iconSize: 22, avatar: 36, fatigue: 46, rating: 7.9,
      players: mk(HOME, 'home').concat(mk(AWAY, 'away')),
      ball: [99.2, 1.6],
      arrows: [{ from: [99, 2.5], to: [90.5, 38.5], kind: 'cross', tone: 'pass', curve: [-6, 2] }],
      marks: [{ x: 84, y: 8, text: '코너킥', tone: 'brand' }],
      feed: [
        { minute: 63, kind: 'shot', text: '박서진 중거리 슈팅' },
        { minute: 63, kind: 'save', text: '골키퍼 쳐냄' },
        { minute: 64, kind: 'corner', text: '코너킥 — 오른쪽' }
      ],
      hand: [
        { id: 'fk', name: '프리킥 스페셜', type: 'setpiece', rarity: 'rare' },
        { id: 'mom', name: '기세', type: 'combo', rarity: 'rare' },
        { id: 'pan', name: '파넨카', type: 'setpiece', rarity: 'epic' },
        { id: 'focus', name: '집중', type: 'manage', rarity: 'common' }
      ]
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
