<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>세이브-슬롯</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 세이브-슬롯 (훈련 · 세이브) · 390×844 · 원본 Save-Slots.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.HeroPanel" title="저장" eyebrow="자동 저장 · 오늘 14:32 · 경기 전" chips="{{chips}}"></x-import>
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 0;">
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="수동 저장" action="3칸"></x-import>
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 16px; background: var(--surface-1); box-shadow: {{s.ring}};">
          <span style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--surface-3); font-family: var(--font-display); font-size: 15px; font-weight: 700; color: {{s.numInk}};">{{s.n}}</span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;"><b style="font-size: 14px;">{{s.title}}</b><span style="font-size: 11px; color: var(--ink-muted);">{{s.meta}}</span><sc-if value="{{s.ver}}"><span style="font-size: 11px; font-weight: 600; color: var(--ink-faint);">{{s.ver}}</span></sc-if></span>
          <x-import component-from-global-scope="PlayerOne.Button" size="sm" variant="{{s.v}}" icon="{{s.icon}}">{{s.btn}}</x-import>
        </div>
      </sc-for>
    <div style="height: 6px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="자동 저장"></x-import>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 16px; background: var(--surface-1);">
      <span style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--surface-3); color: var(--brand-ink);"><x-import component-from-global-scope="PlayerOne.Icon" name="restore" size="{{s18}}"></x-import></span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;"><b style="font-size: 14px;">오늘 14:32</b><span style="font-size: 11px; color: var(--ink-muted);">경기 전·하루 진행 뒤마다 자동으로 저장돼요</span><span style="font-size: 11px; font-weight: 600; color: var(--ink-faint);">C.16에서 시작</span></span>
      <x-import component-from-global-scope="PlayerOne.Button" size="sm" variant="secondary">불러오기</x-import>
    </div>
    <div style="height: 6px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="파일"></x-import>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <x-import component-from-global-scope="PlayerOne.Button" variant="secondary" size="lg" block="{{yes}}" icon="download">내보내기</x-import>
      <x-import component-from-global-scope="PlayerOne.Button" variant="secondary" size="lg" block="{{yes}}" icon="upload">가져오기</x-import>
    </div>
    <span style="font-size: 12px; line-height: 17px; color: var(--ink-muted);">다른 기기로 옮기거나 백업할 때 써요. 파일(.p1save)을 가져오면 선택한 슬롯을 덮어써요.</span>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, s18: 18, chips: ['수동 2/3', { label: '자동 저장 켜짐', soft: true }],
      slots: [
        { n: 1, title: '시즌 1 · 5주차', meta: '김민준 17세 · OVR 56 · 2026.10.15 13:05', ver: 'C.16에서 시작', btn: '불러오기', v: 'secondary', icon: 'upload', ring: 'inset 0 0 0 1.5px var(--brand-ink)', numInk: 'var(--brand-ink)' },
        { n: 2, title: '시즌 1 · 3주차', meta: '김민준 17세 · OVR 54 · 2026.10.12 22:41', ver: 'C.16에서 시작', btn: '불러오기', v: 'secondary', icon: 'upload', ring: 'none', numInk: 'var(--ink)' },
        { n: 3, title: '비어 있음', meta: '지금 진행 상황을 여기에 저장해요', ver: '', btn: '여기에 저장', v: 'primary', icon: 'disk', ring: 'inset 0 0 0 1px var(--line)', numInk: 'var(--ink-faint)' }
      ]
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
