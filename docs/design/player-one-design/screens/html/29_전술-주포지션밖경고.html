<!doctype html>
<html lang="ko" data-theme="dark">
<head>

<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">

<body>
<!-- 화면: 전술-주포지션밖경고 (전술 화면) · 390×844 · 원본 Tactic-OffPosition.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.HeroPanel" title="전술" right="리버풀전" chips="{{chips}}"></x-import>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0;">
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="② 포메이션과 역할 · 내 위치 옮기기"></x-import>
    <x-import component-from-global-scope="PlayerOne.Tabs" variant="segment" items="{{forms}}" value="4231" label="포메이션"></x-import>
    <x-import component-from-global-scope="PlayerOne.FormationPitch" slots="{{pitchOff}}"></x-import>
  </div>
  <div style="position: absolute; inset: 0; background: var(--scrim);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0;">
    <x-import component-from-global-scope="PlayerOne.BottomSheet" inline="{{yes}}" eyebrow="내 위치 옮기기 · ST → RW" title="주 포지션 밖이에요">
      <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; background: var(--surface-1);">
        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 11px; font-weight: 700; color: var(--ink-muted);">ST (주 포지션)</span><b style="font-family: var(--font-display); font-size: 32px; line-height: 38px;">56</b></div>
        <span style="color: var(--ink-faint); font-size: 18px;">→</span>
        <div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end;"><span style="font-size: 11px; font-weight: 700; color: var(--ink-muted);">RW</span><b style="font-family: var(--font-display); font-size: 32px; line-height: 38px; color: var(--fail);">49</b></div>
      </div>
      <div style="display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap;">
        <x-import component-from-global-scope="PlayerOne.StatChip" label="OVR" value="−7" tone="fail"></x-import>
        <x-import component-from-global-scope="PlayerOne.StatChip" label="크로스·속도 기준" tone="neutral"></x-import>
        <x-import component-from-global-scope="PlayerOne.FitBadge" fit="bad" label="RW 적합도"></x-import>
      </div>
      <span style="display: block; margin-top: 10px; font-size: 12px; line-height: 17px; color: var(--ink-muted);">RW에서는 경기 평점이 낮게 나오기 쉽고, 감독이 선발에서 뺄 수도 있어요. 원래 RW였던 임성빈은 ST로 옮겨요.</span>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;">
        <x-import component-from-global-scope="PlayerOne.Button" variant="secondary" size="lg" block="{{yes}}">ST에 남기</x-import>
        <x-import component-from-global-scope="PlayerOne.Button" variant="danger" size="lg" block="{{yes}}">RW로 옮기기</x-import>
      </div>
    </x-import>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    const SLOTS = [
      { id: 'gk', pos: 'GK', x: 50, y: 9, name: '오세훈', role: '스위퍼 키퍼' },
      { id: 'lb', pos: 'LB', x: 14, y: 26, name: '정우진', role: '수비형 풀백' },
      { id: 'cb1', pos: 'CB', x: 37, y: 22, name: '한도윤', role: '스토퍼' },
      { id: 'cb2', pos: 'CB', x: 63, y: 22, name: '박재성', role: '커버 CB' },
      { id: 'rb', pos: 'RB', x: 86, y: 26, name: '이현수', role: '수비형 풀백' },
      { id: 'dm1', pos: 'CDM', x: 38, y: 43, name: '최민호', role: '앵커' },
      { id: 'dm2', pos: 'CDM', x: 62, y: 43, name: '윤태경', role: '박스투박스' },
      { id: 'lw', pos: 'LW', x: 16, y: 66, name: '강지훈', role: '윙포워드' },
      { id: 'am', pos: 'CAM', x: 50, y: 63, name: '서준영', role: '섀도 스트라이커' },
      { id: 'rw', pos: 'RW', x: 84, y: 66, name: '임성빈', role: '정통 윙어' },
      { id: 'st', pos: 'ST', x: 50, y: 85, name: '김민준', role: '포처', me: true, ovr: 56 }
    ];
    const slot = (id, extra) => SLOTS.map((s) => s.id === id ? Object.assign({}, s, extra) : s);
    const fitOf = { balanced: 'ok', tikitaka: 'bad', gegen: 'ok', counter: 'good', direct: 'ok', block: 'bad' };
    const styles = (on) => ['balanced', 'tikitaka', 'gegen', 'counter', 'direct', 'block'].map((id) => ({ id, fit: fitOf[id], on: id === on }));
    const forms = ['4-4-2', '4-3-3', '4-2-3-1', '3-5-2', '5-3-2', '4-3-1-2', '4-1-4-1', '3-4-3'].map((l) => ({ id: l.replace(/-/g, ''), label: l })).concat([{ id: 'custom', label: '커스텀', icon: 'plus' }]);
    const forms8 = forms.slice(0, 8);
    const seg = (a, b, c) => [{ id: a, label: a }, { id: b, label: b }, { id: c, label: c }];
    const settings = (line, press, build, width, tag) => [
      { label: '수비 라인', hint: tag, items: seg('낮음', '보통', '높음'), value: line },
      { label: '압박', hint: tag, items: seg('낮음', '보통', '높음'), value: press },
      { label: '빌드업', hint: tag, items: seg('짧게', '혼합', '직선'), value: build },
      { label: '공격 폭', hint: tag, items: seg('좁게', '보통', '넓게'), value: width }
    ];
    const myOvr = { gk: 22, lb: 38, cb1: 35, cb2: 35, rb: 38, dm1: 41, dm2: 41, lw: 49, am: 52, rw: 49 };
    const pitchOff = SLOTS.map((s) => s.id === 'st' ? Object.assign({}, s, { me: false, dim: true, name: '임성빈', ovr: undefined })
      : s.id === 'rw' ? Object.assign({}, s, { name: '김민준', me: true, warn: true, ovr: 49, ovrDown: true }) : s);
    return { yes: true, forms, chips: ['역습', '4-2-3-1', '내 위치 변경 중'], pitchOff };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
