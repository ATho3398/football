<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>경기화면-결정순간</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 경기화면-결정순간 (I.4 경기 화면) · 390×844 · 원본 Match2-Decision.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.ScoreBar" mode="manual" home-tactic="{{homeTactic}}" away-tactic="{{awayTactic}}" home="리버사이드 FC" away="리버풀" home-score="{{one}}" away-score="{{zero}}" minute="{{minute}}" speed="2×" paused="{{yes}}" status="결정 순간" view="highlight" scene="{{scene}}"></x-import>
  <div style="padding: 12px 16px 0;">
    <x-import component-from-global-scope="PlayerOne.Pitch" players="{{players}}" ball="{{ball}}" arrows="{{arrows}}" offside-x="{{offsideX}}" label="결정 순간: 침투 패스 방향 미리보기"></x-import>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0;">
    <x-import component-from-global-scope="PlayerOne.BottomSheet" inline="{{yes}}" eyebrow="52' · 결정 순간" title="하프라인을 넘어 공을 잡았어요">
      <x-import component-from-global-scope="PlayerOne.ChoiceButton" kind="safe" name="레이오프 · 2선에게" chance="{{c1}}" success="{{s1}}" fail="{{f1}}"></x-import>
      <x-import component-from-global-scope="PlayerOne.ChoiceButton" kind="balanced" name="버티기 · 등지고 지키기" chance="{{c2}}" success="{{s2}}" fail="{{f2}}"></x-import>
      <x-import component-from-global-scope="PlayerOne.ChoiceButton" kind="gamble" name="침투 패스" chance="{{c3}}" offside="mid" selected="{{yes}}" success="{{s3}}" fail="{{f3}}"></x-import>
      <x-import component-from-global-scope="PlayerOne.Button" size="lg" block="{{yes}}" style="margin-top: 4px;">침투 패스로 결정 · 31%</x-import>
    </x-import>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    const mk = (list, team) => list.map((p) => ({ x: p[0], y: p[1], num: p[2], team, me: !!p[3], label: p[3] ? '김민준' : undefined }));
    const HOME = [[8,50,1],[34,18,2],[32,40,4],[32,60,5],[35,82,3],[50,30,8],[48,52,6],[56,70,10],[72,22,7],[66,46,9,1],[70,80,11]];
    const AWAY = [[95,50,1],[80,24,2],[79,42,5],[80,58,4],[82,78,3],[70,30,7],[66,52,8],[68,64,6],[72,82,11],[56,40,9],[58,60,10]];
    const me = [66, 46];
    return {
      scene: { index: 4, total: 7, minute: 52, label: '내 결정' },
      homeTactic: { tactic: 'counter', formation: '4-2-3-1' }, awayTactic: { tactic: 'gegen', formation: '4-3-3' }, 
      yes: true, one: 1, zero: 0, minute: 52, offsideX: 79,
      players: mk(HOME, 'home').concat(mk(AWAY, 'away')),
      ball: [67.4, 47.6],
      arrows: [
        { from: me, to: [72, 24], kind: 'pass', tone: 'safe', ghost: true },
        { from: me, to: [78, 54], kind: 'dribble', tone: 'balanced', ghost: true },
        { from: me, to: [88, 30], kind: 'through', tone: 'gamble', curve: [-2, -6] }
      ],
      c1: 82, s1: { text: '점유 유지', rating: 0.1 }, f1: { text: '차단', rating: -0.2 },
      c2: 48, s2: { text: '파울 유도', rating: 0.3 }, f2: { text: '뺏김', rating: -0.3 },
      c3: 31, s3: { text: '1대1 찬스', rating: 0.6 }, f3: { text: '오프사이드', rating: -0.25 }
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
