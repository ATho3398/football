<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">

<style>body{margin:0;background:var(--surface-0)}</style>

<body>
<!-- 화면: 덱편집-카드상세 (I.9 덱 편집 · 경기 전) · 390×844 · 원본 Deck2-CardDetail.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <div style="opacity: 0.35;">
    <x-import component-from-global-scope="PlayerOne.HeroPanel" title="덱 편집" eyebrow="내 덱 · 경기 전 확정" value="{{deckCount}}" total="{{deckMax}}" chips="{{chips}}"></x-import>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(10, 11, 13, 0.55);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0;">
    <x-import component-from-global-scope="PlayerOne.BottomSheet" inline="{{yes}}" eyebrow="카드 상세 · 덱에 1장">
      <div style="display: flex; justify-content: center; margin-top: -4px;">
        <x-import component-from-global-scope="PlayerOne.GameCard" card="{{card}}" size="full"></x-import>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px;">
        <x-import component-from-global-scope="PlayerOne.Meter" label="숙련도 · Lv.2 → Lv.3" value="{{xp}}" max="{{xpMax}}" show-value="{{yes}}"></x-import>
        <span style="font-size: 12px; line-height: 17px; color: var(--ink-muted);">Lv.3이 되면 성공 확률 보너스가 <b style="font-family: var(--font-display); color: var(--brand-ink);">+15%p</b>로 올라가요. 경기에서 쓸 때마다 숙련도가 쌓여요.</span>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 4px;">
        <x-import component-from-global-scope="PlayerOne.Button" variant="secondary" size="lg" style="flex: 1;">덱에서 빼기</x-import>
        <x-import component-from-global-scope="PlayerOne.Button" size="lg" icon="plus" style="flex: 1;">한 장 더 넣기</x-import>
      </div>
    </x-import>
  </div>
</div>
</template>
