<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>경기화면-자동모드</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 경기화면-자동모드 (I.4 경기 화면) · 390×844 · 원본 Match3-AutoMode.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.ScoreBar" mode="auto" home-tactic="{{homeTactic}}" away-tactic="{{awayTactic}}" home="리버사이드 FC" away="리버풀" home-score="{{two}}" away-score="{{one}}" minute="{{minute}}" speed="4×"></x-import>
  <div style="display: flex; align-items: center; gap: 10px; margin: 12px 16px 0; padding: 10px 10px 10px 14px; border-radius: 14px; background: var(--brand); color: var(--on-brand);">
    <x-import component-from-global-scope="PlayerOne.Icon" name="advantage" size="{{icon}}" stroke-width="{{stroke}}"></x-import>
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <span style="font-size: 14px; font-weight: 800;">자동 모드 · 4배속</span>
      <span style="font-size: 12px; font-weight: 600; opacity: 0.7;">골과 부상에서만 멈춰요. 결정은 자동으로 골라요.</span>
    </div>
    <x-import component-from-global-scope="PlayerOne.Button" variant="secondary" size="sm">직접 모드</x-import>
  </div>
  <div style="padding: 10px 16px 6px;">
    <x-import component-from-global-scope="PlayerOne.Pitch" players="{{players}}" ball="{{ball}}" label="자동 모드 진행 중"></x-import>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px; padding: 6px 16px 8px;">
    <sc-for list="{{feed}}" as="item" hint-placeholder-count="5">
      <x-import component-from-global-scope="PlayerOne.FeedItem" minute="{{item.minute}}" kind="{{item.kind}}" mine="{{item.mine}}" text="{{item.text}}" score="{{item.score}}"></x-import>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding: 16px 16px 28px; border-radius: 20px 20px 0 0; background: var(--surface-1);">
    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink-muted);">
      <x-import component-from-global-scope="PlayerOne.Icon" name="lock" size="{{small}}"></x-import>
      패 4장 보관 중 · 자동 모드에선 쓰지 않아요
    </span>
    <x-import component-from-global-scope="PlayerOne.RatingBadge" value="{{rating}}" delta="{{delta}}" size="sm"></x-import>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    const mk = (list, team) => list.map((p) => ({ x: p[0], y: p[1], num: p[2], team, me: !!p[3], label: p[3] ? '김민준' : undefined }));
    const HOME = [[8,50,1],[30,18,2],[28,40,4],[28,60,5],[32,82,3],[46,30,8],[44,52,6],[52,70,10],[64,22,7],[62,48,9,1],[62,78,11]];
    const AWAY = [[95,50,1],[78,22,2],[76,42,5],[77,60,4],[79,80,3],[64,30,7],[58,46,8],[60,62,6],[66,80,11],[48,40,9],[50,60,10]];
    return {
      homeTactic: { tactic: 'counter', formation: '4-2-3-1' }, awayTactic: { tactic: 'gegen', formation: '4-3-3' }, 
      yes: true, one: 1, two: 2, minute: 74, icon: 20, stroke: 2.6, small: 16, rating: 7.2, delta: 0.1,
      players: mk(HOME, 'home').concat(mk(AWAY, 'away')),
      ball: [45.2, 53.6],
      feed: [
        { minute: 52, kind: 'concede', text: '실점', score: '1-1' },
        { minute: 61, kind: 'chance', mine: true, text: '자동 결정: 안전 · 옆으로 패스 (82%) → 성공' },
        { minute: 61, kind: 'goal', text: '골! 박서진 · 어시스트 김민준', score: '2-1' },
        { minute: 70, kind: 'chance', mine: true, text: '자동 결정: 균형 · 드리블 돌파 (48%) → 실패' },
        { minute: 73, kind: 'sub', text: '교체: 이도윤 OUT' }
      ]
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
