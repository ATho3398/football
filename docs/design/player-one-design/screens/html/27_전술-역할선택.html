<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>전술-역할선택</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 전술-역할선택 (전술 화면) · 390×844 · 원본 Tactic-RolePick.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.HeroPanel" title="전술" right="리버풀전" chips="{{chips}}"></x-import>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0;">
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="② 포메이션과 역할"></x-import>
    <x-import component-from-global-scope="PlayerOne.Tabs" variant="segment" items="{{forms}}" value="4231" label="포메이션"></x-import>
    <x-import component-from-global-scope="PlayerOne.FormationPitch" slots="{{pitchSel}}"></x-import>
  </div>
  <div style="position: absolute; inset: 0; background: var(--scrim);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0;">
    <x-import component-from-global-scope="PlayerOne.BottomSheet" inline="{{yes}}" eyebrow="LW 슬롯 · 강지훈" title="역할 고르기" subtitle="윙 역할 5개 · 시그니처 카드(희귀)는 그 역할일 때만 써요.">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
          <x-import component-from-global-scope="PlayerOne.OptionRow" title="{{r.title}}" desc="{{r.desc}}" fit="{{r.fit}}" note="{{r.note}}" radio="{{yes}}" selected="{{r.on}}" on-click="{{noop}}"></x-import>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 14px;">
        <x-import component-from-global-scope="PlayerOne.Button" variant="secondary" size="lg" block="{{yes}}">취소</x-import>
        <x-import component-from-global-scope="PlayerOne.Button" size="lg" block="{{yes}}">크랙형 윙어로 정하기</x-import>
      </div>
    </x-import>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    const SLOTS = [
      { id: 'gk', pos: 'GK', x: 50, y: 9, name: '오세훈', role: '스위퍼 키퍼' },
      { id: 'lb', pos: 'LB', x: 14, y: 26, name: '정우진', role: '수비형 풀백' },
      { id: 'cb1', pos: 'CB', x: 37, y: 22, name: '한도윤', role: '스토퍼' },
      { id: 'cb2', pos: 'CB', x: 63, y: 22, name: '박재성', role: '커버 CB' },
      { id: 'rb', pos: 'RB', x: 86, y: 26, name: '이현수', role: '수비형 풀백' },
      { id: 'dm1', pos: 'CDM', x: 38, y: 43, name: '최민호', role: '앵커' },
      { id: 'dm2', pos: 'CDM', x: 62, y: 43, name: '윤태경', role: '박스투박스' },
      { id: 'lw', pos: 'LW', x: 16, y: 66, name: '강지훈', role: '윙포워드' },
      { id: 'am', pos: 'CAM', x: 50, y: 63, name: '서준영', role: '섀도 스트라이커' },
      { id: 'rw', pos: 'RW', x: 84, y: 66, name: '임성빈', role: '정통 윙어' },
      { id: 'st', pos: 'ST', x: 50, y: 85, name: '김민준', role: '포처', me: true, ovr: 56 }
    ];
    const slot = (id, extra) => SLOTS.map((s) => s.id === id ? Object.assign({}, s, extra) : s);
    const fitOf = { balanced: 'ok', tikitaka: 'bad', gegen: 'ok', counter: 'good', direct: 'ok', block: 'bad' };
    const styles = (on) => ['balanced', 'tikitaka', 'gegen', 'counter', 'direct', 'block'].map((id) => ({ id, fit: fitOf[id], on: id === on }));
    const forms = ['4-4-2', '4-3-3', '4-2-3-1', '3-5-2', '5-3-2', '4-3-1-2', '4-1-4-1', '3-4-3'].map((l) => ({ id: l.replace(/-/g, ''), label: l })).concat([{ id: 'custom', label: '커스텀', icon: 'plus' }]);
    const forms8 = forms.slice(0, 8);
    const seg = (a, b, c) => [{ id: a, label: a }, { id: b, label: b }, { id: c, label: c }];
    const settings = (line, press, build, width, tag) => [
      { label: '수비 라인', hint: tag, items: seg('낮음', '보통', '높음'), value: line },
      { label: '압박', hint: tag, items: seg('낮음', '보통', '높음'), value: press },
      { label: '빌드업', hint: tag, items: seg('짧게', '혼합', '직선'), value: build },
      { label: '공격 폭', hint: tag, items: seg('좁게', '보통', '넓게'), value: width }
    ];
    const myOvr = { gk: 22, lb: 38, cb1: 35, cb2: 35, rb: 38, dm1: 41, dm2: 41, lw: 49, am: 52, rw: 49 };
    return {
      yes: true, noop: () => {}, forms,
      chips: ['역습', '4-2-3-1', 'LW 역할 변경 중'],
      pitchSel: slot('lw', { selected: true }),
      roles: [
        { title: '정통 윙어', fit: 'ok', desc: '터치라인을 타고 올라가 크로스를 올려요.', note: '시그니처 · 바이라인 컷백', on: false },
        { title: '윙포워드', fit: 'good', desc: '안쪽으로 파고들어 직접 슈팅을 노려요.', note: '시그니처 · 접고 감아차기', on: false },
        { title: '크랙형 윙어', fit: 'good', desc: '1대1 돌파로 혼자 기회를 만들어요.', note: '시그니처 · 연속 제치기', on: true },
        { title: '라움도이터', fit: 'bad', desc: '빈 공간을 찾아 침투해 마무리해요.', note: '시그니처 · 빈 공간 원터치', on: false },
        { title: '와이드 미드필더', fit: 'ok', desc: '수비 가담을 하며 측면 균형을 잡아요.', note: '시그니처 · 측면 복귀 태클', on: false }
      ]
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
