<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>경기후-리포트</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 경기후-리포트 (경기 후) · 390×1150 · 원본 PostMatch-Report.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1150px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.HeroPanel" title="경기 결과" right="리그 5R" eyebrow="리버풀전 2-1 승 · 내 평점" value="7.6" progress="{{no}}" chips="{{chips}}"></x-import>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0;">
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="하이라이트" action="내 장면 3"></x-import>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{feed}}" as="item" hint-placeholder-count="4">
        <x-import component-from-global-scope="PlayerOne.FeedItem" minute="{{item.minute}}" kind="{{item.kind}}" mine="{{item.mine}}" text="{{item.text}}" score="{{item.score}}"></x-import>
      </sc-for>
    </div>
    <div style="height: 4px;"></div>
    <x-import component-from-global-scope="PlayerOne.Tabs" variant="underline" items="{{rtabs}}" value="report"></x-import>
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 14px; border-radius: 20px; background: var(--surface-1);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <x-import component-from-global-scope="PlayerOne.TacticChip" size="sm" tactic="counter" formation="4-2-3-1"></x-import>
        <x-import component-from-global-scope="PlayerOne.TacticChip" size="sm" tactic="gegen" formation="4-3-3" away="{{yes}}"></x-import>
      </div>
      <x-import component-from-global-scope="PlayerOne.PossessionBar" home="{{poss}}"></x-import>
        <sc-for list="{{cmp}}" as="c" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="display: grid; grid-template-columns: 56px 1fr 56px; align-items: baseline; font-size: 12px;">
              <b style="font-family: var(--font-display); font-size: 16px; font-weight: 700;">{{c.home}}</b>
              <span style="text-align: center; font-weight: 700; color: var(--ink-muted);">{{c.label}}</span>
              <b style="font-family: var(--font-display); font-size: 16px; font-weight: 700; text-align: right; color: var(--away);">{{c.away}}</b>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; height: 6px;">
              <span style="display: flex; justify-content: flex-end; border-radius: 3px; background: var(--surface-3); overflow: hidden;"><i style="width: {{c.hw}}; background: var(--team-home);"></i></span>
              <span style="display: flex; border-radius: 3px; background: var(--surface-3); overflow: hidden;"><i style="width: {{c.aw}}; background: var(--away);"></i></span>
            </div>
          </div>
        </sc-for>
      <div style="display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--brand-soft); font-size: 12px; line-height: 17px;">
        <b style="flex: none; color: var(--brand-ink);">✓ 역습이 통했어요</b>
        <span style="color: var(--ink);">슈팅 9개 중 5개가 역습에서 나왔어요. 상대 압박에 공은 자주 뺏겼어요.</span>
      </div>
    </div>
    <div style="height: 8px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="보상"></x-import>
    <div style="display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface-1);">
      <x-import component-from-global-scope="PlayerOne.Meter" label="XP +25 · 다음 레벨까지 200" value="{{xp}}" gain="{{xpGain}}" max="{{xpMax}}" show-value="{{yes}}" tone="xp"></x-import>
      <x-import component-from-global-scope="PlayerOne.Meter" label="신뢰도 +4 · 평점 7.0↑ +2, 골 +1, 승 +1" value="{{trust}}" gain="{{trustGain}}" show-value="{{yes}}" tone="mine"></x-import>
    </div>
  </div>
  <div style="margin-top: auto; padding: 20px 16px;">
    <x-import component-from-global-scope="PlayerOne.Button" size="lg" block="{{yes}}" icon-right="chevron-right">다음</x-import>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    const pct = (a, b) => [Math.round(a / Math.max(a, b) * 100) + '%', Math.round(b / Math.max(a, b) * 100) + '%'];
    const row = (label, home, away, a, b) => { const p = pct(a, b); return { label, home, away, hw: p[0], aw: p[1] }; };
    return {
      rtabs: [{ id: 'report', label: '전술 리포트' }, { id: 'log', label: '내 결정 기록', badge: 6 }],
      yes: true, no: false, poss: 41, xp: 120, xpGain: 25, xpMax: 200, trust: 62, trustGain: 4,
      chips: ['골 1', '결정 4회 중 3회 성공', { label: 'MOM 후보', soft: true }],
      feed: [
        { minute: 18, kind: 'goal', mine: true, text: '골! 김민준 · 역습 마무리', score: '1-0' },
        { minute: 63, kind: 'chance', mine: true, text: '김민준, 버티기 성공 → 레이오프' },
        { minute: 71, kind: 'tactic', text: '상대가 라인을 올립니다' },
        { minute: 84, kind: 'goal', text: '골! 강지훈 · 컷백 패스 마무리', score: '2-1' }
      ],
      cmp: [
        row('슈팅', 9, 14, 9, 14),
        row('상대 진영 볼 탈취', 6, 11, 6, 11),
        row('롱패스 비율', '31%', '12%', 31, 12)
      ]
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
