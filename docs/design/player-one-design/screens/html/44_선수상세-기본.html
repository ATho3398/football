<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>선수상세-기본</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 선수상세-기본 (선수 상세 · 면담 · 카드) · 390×1220 · 원본 Player-Detail.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1220px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.HeroPanel" title="선수" right="리버사이드 FC" eyebrow="김민준 · ST · 17세 · OVR" value="{{ovr}}" pad="{{no}}" progress="{{no}}" chips="{{chips}}"></x-import>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0;">
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="경고와 출장"></x-import>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface-1);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 13px; font-weight: 800;">경고 누적</span>
        <span style="display: inline-flex; align-items: center; gap: 4px;">
          <sc-for list="{{pips}}" as="p" hint-placeholder-count="5"><i style="width: 12px; height: 16px; border-radius: 2px; background: {{p}};"></i></sc-for>
          <b style="margin-left: 6px; font-family: var(--font-display); font-size: 15px;">2/5</b>
        </span>
      </div>
      <span style="font-size: 12px; color: var(--ink-muted);">옐로카드 5장이 쌓이면 다음 1경기에 나올 수 없어요.</span>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--fail-soft);">
        <i style="flex: none; width: 12px; height: 16px; border-radius: 2px; background: var(--card-red);"></i>
        <span style="flex-grow: 1; font-size: 13px; font-weight: 700;">출장 정지 1경기 남음</span>
        <span style="font-size: 12px; font-weight: 700; color: var(--fail);">리버풀전 결장</span>
      </div>
    </div>
    <div style="height: 8px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="팀에서 내 역할" action="읽기 전용"></x-import>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface-1);">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <b style="font-size: 15px;">ST 슬롯 · <span style="color: var(--mine);">포처</span></b>
          <span style="font-size: 12px; color: var(--ink-muted);">박스 안에서 마무리에 집중해요.</span>
        </span>
        <x-import component-from-global-scope="PlayerOne.FitBadge" fit="ok"></x-import>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <x-import component-from-global-scope="PlayerOne.TacticChip" size="sm" tactic="counter" formation="4-2-3-1"></x-import>
        <x-import component-from-global-scope="PlayerOne.Button" size="sm" variant="ghost" icon-right="chevron-right">전술에서 바꾸기</x-import>
      </div>
    </div>
    <div style="height: 8px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="성향 설정"></x-import>
    <div style="display: flex; flex-direction: column; gap: 18px; padding: 16px 14px; border-radius: 16px; background: var(--surface-1);">
      <sc-for list="{{sliders}}" as="s" hint-placeholder-count="3">
        <x-import component-from-global-scope="PlayerOne.Slider" label="{{s.label}}" value="{{s.value}}" value-label="{{s.vl}}" left="{{s.left}}" right="{{s.right}}"></x-import>
      </sc-for>
      <span style="font-size: 12px; line-height: 17px; color: var(--ink-muted);">성향은 결정 순간의 추천 선택지와 자동 진행 때 내 선수의 판단에 반영돼요.</span>
    </div>
    <div style="height: 8px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="주요 능력치" action="25개 전체 ›"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: var(--surface-1);">
      <sc-for list="{{stats}}" as="st" hint-placeholder-count="4">
        <x-import component-from-global-scope="PlayerOne.StatBar" label="{{st.label}}" value="{{st.value}}"></x-import>
      </sc-for>
    </div>
  </div>
  <div style="margin-top: auto; height: 20px;"></div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, no: false, ovr: 56,
      chips: ['위상 일반 · 12점', '폼 좋음', { label: '옐로 2/5', soft: true }],
      pips: ['var(--card-yellow)', 'var(--card-yellow)', 'var(--surface-3)', 'var(--surface-3)', 'var(--surface-3)'],
      sliders: [
        { label: '이기심', value: 40, vl: '균형', left: '패스 우선', right: '슈팅 우선' },
        { label: '돌파', value: 68, vl: '과감한 편', left: '안전하게', right: '과감하게' },
        { label: '수비 가담', value: 30, vl: '공격 집중', left: '공격에 집중', right: '적극 가담' }
      ],
      stats: [
        { label: '슈팅', value: 61 }, { label: '공격 위치선정', value: 63 }, { label: '침착성', value: 55 }, { label: '속도', value: 66 }
      ]
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
