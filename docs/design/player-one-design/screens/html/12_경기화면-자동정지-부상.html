<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>경기화면-자동정지-부상</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 경기화면-자동정지-부상 (I.4 경기 화면) · 390×844 · 원본 Match3-Injury.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.ScoreBar" mode="manual" home-tactic="{{homeTactic}}" away-tactic="{{awayTactic}}" home="리버사이드 FC" away="리버풀" home-score="{{one}}" away-score="{{zero}}" minute="{{minute}}" speed="2×" paused="{{yes}}" status="부상" view="highlight" scene="{{scene}}"></x-import>
  <div style="padding: 12px 16px 0;">
    <x-import component-from-global-scope="PlayerOne.Pitch" players="{{players}}" ball="{{ball}}" marks="{{marks}}" label="자동 정지: 김민준 부상"></x-import>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0;">
    <x-import component-from-global-scope="PlayerOne.BottomSheet" inline="{{yes}}" eyebrow="67' · 자동 정지" title="김민준이 쓰러졌어요" subtitle="의료진이 확인 중이에요. 계속 뛸지 정해 주세요.">
      <x-import component-from-global-scope="PlayerOne.Banner" tone="injury" title="발목 통증 · 경미">계속 뛰다 악화되면 2~3주 결장해요.</x-import>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 4px;">
        <x-import component-from-global-scope="PlayerOne.FatigueGauge" value="{{fatigue}}"></x-import>
        <x-import component-from-global-scope="PlayerOne.RatingBadge" value="{{rating}}" size="sm"></x-import>
      </div>
      <x-import component-from-global-scope="PlayerOne.ChoiceButton" kind="gamble" name="계속 뛰기" chance="{{keep}}" success="{{keepOk}}" fail="{{keepBad}}"></x-import>
      <x-import component-from-global-scope="PlayerOne.Button" variant="secondary" size="lg" block="{{yes}}" icon="sub">교체 요청 · 평점 그대로</x-import>
    </x-import>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    const mk = (list, team) => list.map((p) => ({ x: p[0], y: p[1], num: p[2], team, me: !!p[3], label: p[3] ? '김민준' : undefined, dim: !p[3] }));
    const HOME = [[10,50,1],[38,18,2],[36,40,4],[36,60,5],[40,82,3],[54,30,8],[52,52,6],[60,70,10],[74,22,7],[76,46,9,1],[72,78,11]];
    const AWAY = [[95,50,1],[82,24,2],[80,42,5],[81,58,4],[83,76,3],[70,30,7],[78,50,8],[68,64,6],[72,84,11],[58,40,9],[60,60,10]];
    return {
      scene: { index: 5, total: 7, minute: 67, label: '부상' },
      homeTactic: { tactic: 'counter', formation: '4-2-3-1' }, awayTactic: { tactic: 'gegen', formation: '4-3-3' }, 
      yes: true, one: 1, zero: 0, minute: 67, fatigue: 72, rating: 7.1, keep: 70,
      keepOk: { text: '이상 없이 계속', rating: 0 }, keepBad: { text: '부상 악화 · 교체', rating: -0.3 },
      players: mk(HOME, 'home').concat(mk(AWAY, 'away')),
      ball: [79, 52],
      marks: [{ x: 76, y: 36, text: '부상', tone: 'fail' }]
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
