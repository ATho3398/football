<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>시즌종료-요약</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 시즌종료-요약 (요청 4 · 디자인 없던 화면) · 390×1300 · 원본 Season-Summary.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1300px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.HeroPanel" title="시즌 1 종료" on-back="{{no}}" right="2026/27" eyebrow="리그 최종 순위" value="4위" pad="{{no}}" chips="{{chips}}"></x-import>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0;">
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="내 시즌" action="31경기"></x-import>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{season}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 0; border-radius: 14px; background: var(--surface-1);">
          <b style="font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 26px; color: {{s.ink}};">{{s.v}}</b><span style="font-size: 11px; font-weight: 700; color: var(--ink-muted);">{{s.l}}</span>
        </div>
      </sc-for>
    </div>
    <div style="height: 6px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="업적 XP" action="+180"></x-import>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface-1);">
      <sc-for list="{{achv}}" as="a" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--surface-3); color: var(--brand-ink);"><x-import component-from-global-scope="PlayerOne.Icon" name="{{a.icon}}" size="{{i16}}"></x-import></span>
          <span style="flex-grow: 1; font-size: 13px; font-weight: 700;">{{a.t}}</span>
          <b style="font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--brand-ink);">{{a.xp}}</b>
        </div>
      </sc-for>
      <x-import component-from-global-scope="PlayerOne.Meter" label="Lv 12 → 13" value="{{xp}}" gain="{{xpGain}}" max="{{xpMax}}" show-value="{{yes}}" tone="xp"></x-import>
    </div>
    <div style="height: 6px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="능력치 변화" action="OVR 56 → 60"></x-import>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 16px; background: var(--surface-1);">
      <sc-for list="{{growth}}" as="g" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: baseline; justify-content: space-between;">
            <span style="font-size: 13px; font-weight: 800;">{{g.name}} <span style="font-size: 11px; font-weight: 600; color: var(--ink-muted);">{{g.why}}</span></span>
            <b style="font-family: var(--font-display); font-weight: 700; font-size: 14px; color: {{g.ink}};">{{g.sum}}</b>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 5px;">
            <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
              <span style="height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px; border-radius: 7px; background: var(--surface-2); font-size: 11px; font-weight: 700;">{{it.l}} <b style="font-family: var(--font-display); color: {{g.ink}};">{{it.d}}</b></span>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="height: 6px;"></div>
    <x-import component-from-global-scope="PlayerOne.SectionTitle" title="위상 진행도"></x-import>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 16px; background: var(--surface-1);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <x-import component-from-global-scope="PlayerOne.TierBadge" tier="normal" score="{{tierNow}}"></x-import>
        <span style="font-size: 12px; font-weight: 700; color: var(--ink-muted);">시즌 시작 12점 → <b style="font-family: var(--font-display); font-weight: 700; color: var(--ink);">148</b>점</span>
      </div>
      <x-import component-from-global-scope="PlayerOne.Meter" label="스페셜까지 52점 · 덱 슬롯 +1" value="{{tierScore}}" gain="{{tierGain}}" max="{{tierMax}}" show-value="{{yes}}" tone="brand"></x-import>
      <div style="display: flex; flex-wrap: wrap; gap: 5px;">
        <sc-for list="{{tierWhy}}" as="w" hint-placeholder-count="4">
          <span style="height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px; border-radius: 7px; background: var(--surface-2); font-size: 11px; font-weight: 700;">{{w.l}} <b style="font-family: var(--font-display);">{{w.d}}</b></span>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="margin-top: auto; padding: 20px 16px 24px;">
    <x-import component-from-global-scope="PlayerOne.Button" size="lg" block="{{yes}}" icon-right="chevron-right">시즌 2 시작</x-import>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, no: false, i16: 16, xp: 140, xpGain: 180, xpMax: 400, tierScore: 112, tierGain: 36, tierNow: 148, tierMax: 200,
      chips: ['승점 61', '18승 7무 13패', { label: '유럽 대항전 진출', soft: true }],
      season: [
        { v: 12, l: '골', ink: 'var(--brand-ink)' }, { v: 5, l: '도움', ink: 'var(--ink)' },
        { v: '7.0', l: '평균 평점', ink: 'var(--ink)' }, { v: 3, l: 'MOM', ink: 'var(--ink)' }
      ],
      achv: [
        { icon: 'ball', t: '첫 리그 골', xp: '+40' },
        { icon: 'target', t: '시즌 10골 돌파', xp: '+80' },
        { icon: 'star', t: '경기 MOM 3회', xp: '+60' }
      ],
      growth: [
        { name: '자동 성장', why: '17세 · 경기 출전', sum: '+6', ink: 'var(--success)', items: [{ l: '속력', d: '+2' }, { l: '가속', d: '+2' }, { l: '체력', d: '+1' }, { l: '점프', d: '+1' }] },
        { name: '노련함', why: '출전 31경기', sum: '+3', ink: 'var(--success)', items: [{ l: '침착함', d: '+2' }, { l: '위치 선정', d: '+1' }] },
        { name: '노화', why: '29세부터', sum: '0', ink: 'var(--ink-muted)', items: [{ l: '변화 없음', d: '' }] }
      ],
      tierWhy: [{ l: '리그 순위', d: '+40' }, { l: '골 · 도움', d: '+58' }, { l: '평균 평점', d: '+24' }, { l: '대표팀', d: '+14' }]
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
