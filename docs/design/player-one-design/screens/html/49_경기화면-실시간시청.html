<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>경기화면-실시간시청</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 경기화면-실시간시청 (I.4 경기 화면) · 390×844 · 원본 Match6-Live.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="PlayerOne.ScoreBar" mode="manual" home-tactic="{{homeTactic}}" away-tactic="{{awayTactic}}" home="리버사이드 FC" away="리버풀" home-score="{{zero}}" away-score="{{zero}}" minute="{{minute}}" speed="1×" view="live" scene="{{scene}}"></x-import>
  <div style="padding: 8px 16px 4px;">
    <x-import component-from-global-scope="PlayerOne.Pitch" players="{{players}}" ball="{{ball}}" label="실시간 시청: 31분부터 끊김 없이 진행"></x-import>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 16px 8px; font-size: 12px; font-weight: 700; color: var(--ink-muted);">
    <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--brand);"></span>실시간 · 장면 구분 없이 끝까지</span>
    <span style="display: inline-flex; align-items: center; gap: 10px;">
      <span style="display: inline-flex; align-items: center; gap: 4px;"><span style="width: 9px; height: 9px; border-radius: 50%; background: var(--team-home);"></span>우리</span>
      <span style="display: inline-flex; align-items: center; gap: 4px;"><span style="width: 9px; height: 9px; border-radius: 50%; background: #2c2f37; box-shadow: inset 0 0 0 1.5px var(--team-away);"></span>상대</span>
      <span style="display: inline-flex; align-items: center; gap: 4px;"><span style="width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--mine);"></span>나</span>
    </span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; margin: 0 16px 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface-1); box-shadow: inset 0 0 0 1px var(--line);">
    <x-import component-from-global-scope="PlayerOne.Icon" name="info" size="{{icon}}"></x-import>
    <span style="flex-grow: 1; font-size: 12px; line-height: 17px; color: var(--ink-muted);"><b style="color: var(--ink);">31'부터 실시간으로 보고 있어요.</b> 결정 순간은 그대로 멈춰요. 배속 1×/2×/4×를 언제든 바꿀 수 있어요.</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 16px 8px;">
    <sc-for list="{{feed}}" as="item" hint-placeholder-count="2">
      <x-import component-from-global-scope="PlayerOne.FeedItem" minute="{{item.minute}}" kind="{{item.kind}}" mine="{{item.mine}}" text="{{item.text}}" score="{{item.score}}"></x-import>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; margin: 0 16px; padding: 10px 12px; border-radius: 16px; background: var(--surface-1);">
    <x-import component-from-global-scope="PlayerOne.Avatar" size="{{avatar}}" ring="{{yes}}"></x-import>
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800;">김민준 <span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--mine-soft); color: var(--mine); font-size: 11px; font-weight: 800;">ST 슬롯 · 포처</span></span>
      <x-import component-from-global-scope="PlayerOne.FatigueGauge" value="{{fatigue}}" compact="{{yes}}"></x-import>
    </div>
    <x-import component-from-global-scope="PlayerOne.RatingBadge" value="{{rating}}" delta="{{ratingDelta}}"></x-import>
  </div>
  <div style="margin-top: auto; padding-top: 12px; border-radius: 20px 20px 0 0; background: var(--surface-1);">
    <div style="display: flex; justify-content: space-between; padding: 0 16px; font-size: 12px; font-weight: 700;">
      <span>내 패 <span style="font-family: var(--font-display);">5</span></span>
      <span style="color: var(--ink-muted);">결정 순간에 쓸 수 있어요</span>
    </div>
    <x-import component-from-global-scope="PlayerOne.CardHand" cards="{{hand}}"></x-import>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    const mk = (list, team, dim) => list.map((p) => ({ x: p[0], y: p[1], num: p[2], team, dim, me: !!p[3], label: p[3] ? '김민준' : undefined }));
    const tac = { homeTactic: { tactic: 'counter', formation: '4-2-3-1' }, awayTactic: { tactic: 'gegen', formation: '4-3-3' } };
    const hand = [
      { id: 'calm', name: '침착한 마무리', type: 'passive', rarity: 'common' },
      { id: 'fk', name: '프리킥 스페셜', type: 'setpiece', rarity: 'rare' },
      { id: 'mom', name: '기세', type: 'combo', rarity: 'rare' },
      { id: 'pan', name: '파넨카', type: 'setpiece', rarity: 'epic' },
      { id: 'focus', name: '집중', type: 'manage', rarity: 'common' }
    ];
    const HOME = [[10,50,1],[30,14,2],[26,38,4],[26,60,5],[30,86,3],[40,28,8],[38,52,6],[47,70,10],[50,18,7],[52,46,9,1],[48,80,11]];
    const AWAY = [[95,50,1],[78,24,2],[76,42,5],[77,60,4],[78,78,3],[64,30,7],[60,48,8],[62,66,6],[56,80,11],[54,40,9],[56,58,10]];
    return Object.assign({
      scene: { minute: 31 },
      yes: true, zero: 0, minute: 31, icon: 18, avatar: 36, fatigue: 22, rating: 6.9, ratingDelta: 0,
      players: mk(HOME, 'home', false).concat(mk(AWAY, 'away', false)),
      ball: [38.6, 53.2],
      feed: [
        { minute: 31, kind: 'normal', text: '실시간 시청 시작 — 31\'부터 끝까지' },
        { minute: 31, kind: 'normal', text: '정우성, 후방에서 짧게 빌드업' }
      ],
      hand
    }, tac);
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
