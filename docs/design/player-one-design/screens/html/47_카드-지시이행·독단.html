<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>카드-지시이행·독단</title>
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script src="../lib/react-libs.js"></script>
<script src="../lib/bundle.js"></script>
<style>body{margin:0;background:var(--surface-0)}</style>
</head>
<body>
<!-- 화면: 카드-지시이행·독단 (선수 상세 · 면담 · 카드) · 390×1120 · 원본 Card3-Orders.dc.html -->
<template id="tpl">
<helmet>
<style>
body{margin:0;background:#16171b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1120px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="display: flex; gap: 6px;">
        <span style="height: 22px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 6px; background: var(--brand); color: var(--on-brand); font-size: 11px; font-weight: 800;">카드 종류 · 지시</span>
        <span style="height: 22px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; background: var(--surface-3); color: var(--ink-muted); font-size: 11px; font-weight: 800;">5단계에서 활성</span>
      </span>
      <span style="font-size: 20px; line-height: 28px; font-weight: 800;">지시 이행 · 독단</span>
      <span style="font-size: 13px; line-height: 19px; color: var(--ink-muted);">기준은 감독의 지시가 아니라, 내가 전술 화면에서 정한 <b style="color: var(--ink);">슬롯 역할</b>이에요.</span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; background: var(--surface-1);">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800;"><x-import component-from-global-scope="PlayerOne.Icon" name="order" size="{{ic}}"></x-import>지시 이행</span>
        <span style="font-size: 12px; line-height: 17px;">내가 정한 역할대로 팀플레이</span>
        <span style="font-size: 11px; line-height: 16px; font-weight: 700; color: var(--success);">▲ 팀 결과 · 감독 신뢰도 +</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; background: var(--surface-1);">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800;"><x-import component-from-global-scope="PlayerOne.Icon" name="solo" size="{{ic}}"></x-import>독단</span>
        <span style="font-size: 12px; line-height: 17px;">역할을 벗어난 개인 플레이</span>
        <span style="font-size: 11px; line-height: 16px; font-weight: 700;"><span style="color: var(--success);">성공 ▲ 평점 +0.8 · XP ×1.3</span><br><span style="color: var(--fail);">실패 ▼ 감독 신뢰도 −5</span></span>
      </div>
    </div>
    <div style="display: flex; justify-content: center;">
      <x-import component-from-global-scope="PlayerOne.GameCard" card="{{order}}" size="full"></x-import>
    </div>
    <div style="display: flex; justify-content: center;">
      <x-import component-from-global-scope="PlayerOne.GameCard" card="{{solo}}" size="full"></x-import>
    </div>
  </div>
</div>
</template>
<script type="text/plain" id="code">
class Component extends DCLogic {
  renderVals() {
    return {
      ic: 18,
      order: { name: '역할 충실', type: 'order', order: 'follow', pos: 'all', rarity: 'rare', level: 1, effect: { pre: '내가 정한 역할대로 팀플레이를 고르면 팀 성공 확률이 ', hi: '+8%p', post: ', 감독 신뢰도도 올라가요.' }, condition: { text: '지금 슬롯 역할 적합도 보통 이상', met: true, current: '보통' } },
      solo: { name: '혼자 해결', type: 'order', order: 'solo', pos: 'att', rarity: 'epic', level: 1, effect: { pre: '역할을 벗어난 개인 플레이가 성공하면 평점 ', hi: '+0.8', post: ', XP ×1.3. 실패하면 감독 신뢰도 −5.' }, condition: { text: '드리블 55 이상', met: true, current: 58 } }
    };
  }
}
</script>
<div id="r"></div>
<script src="../lib/dc-runtime.js"></script>
</body>
</html>
